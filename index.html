<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanji Sudoku</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="title-container">
      <img src="logo.png" class="app-logo" alt="Kanji Sudoku logo" />

      <h1 class="game-title">
        <span class="kanji">数独</span>
        Kanji Sudoku
        <span class="kanji">和</span>
      </h1>
    </div>

    <div class="top-bar">
      <div id="lives">❤️❤️❤️</div>
      <div id="timer">00:00</div>
      <div id="hints">Hints: 2</div>
    </div>

    <div id="board"></div>

    <div class="controls">
      <button id="new-game-btn">New Game</button>
      <button id="hint-btn">Hint</button>
      <button id="notes-btn">Notes OFF</button>

      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div id="symbol-meaning">Select a symbol</div>

    <div class="store-link-wrap">
      <a
        class="store-link"
        href="https://play.google.com/store/apps/details?id=com.swayamkrushi.kanjisudoku"
        target="_blank"
        rel="noopener noreferrer"
      >
        Get the Android app on Google Play
      </a>
    </div>

    <div id="numpad"></div>
  </div>

  <div id="ad-overlay">
    <div class="spinner"></div>
    <p>Loading Ad...</p>
  </div>

  <script src="script.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanji Sudoku</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <h1>Kanji Sudoku</h1>

    <!-- TOP BAR -->
    <div class="top-bar">
      <div id="lives">❤️❤️❤️</div>
      <div id="timer">00:00</div>
    </div>

    <!-- BOARD -->
    <div id="board"></div>

    <!-- CONTROLS -->
    <div class="controls">
      <button id="new-game-btn">New</button>
      <button id="reward-hint-btn">+1 Hint</button>
      <button id="hint-btn">Hint</button>
      <button id="notes-btn">Notes OFF</button>

      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <!-- NUMPAD -->
    <div id="numpad"></div>

  </div>

  <!-- AD OVERLAY -->
  <div id="ad-overlay" class="hidden">
    <div class="spinner"></div>
    <p>Loading Ad...</p>
  </div>

  <!-- 🔥 FIX: defer added -->
  <script src="script.js" defer></script>

</body>
</html>

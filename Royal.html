<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Sudoku</title>
  <link rel="stylesheet" href="Royal.css" />
<meta name="description"
content="Play Kanji Sudoku online. A unique Sudoku game using Japanese symbols instead of numbers.">
  <!-- Google AdSense -->
<meta name="google-adsense-account"
content="ca-pub-4704776080952179">

<script async
src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4704776080952179"
crossorigin="anonymous"></script>
  
</head>
<body>

  <div class="app">
    <h1>Royal Sudoku</h1>

    <div class="top-bar">
      <div id="timer">00:00</div>

      <div class="status">
        <div id="lives">❤️❤️❤️</div>
        <div id="hints">Hints: 3</div>
      </div>

      <div class="difficulty">
        <button onclick="setDifficulty('easy')">Easy</button>
        <button onclick="setDifficulty('medium')">Medium</button>
        <button onclick="setDifficulty('hard')">Hard</button>
      </div>

      <button id="newGameBtn">New Game</button>
    </div>

    <div id="board" class="board"></div>

    <div id="keypad" class="keypad"></div>

    <div class="actions">
      <button id="eraseBtn">Erase</button>
      <button id="hintBtn">Hint</button>
      <button id="notesBtn">Notes OFF</button>
    </div>

    <div id="message"></div>
  </div>

  <script src="Royal.js"></script>
